worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;
        server_name litellm.boschhuayu-steering.com;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 50m;

        # Bocha search is called by AIGC; its API key remains in AIGC.
        location = /__aigc/bocha-search {
            client_max_body_size 64k;
            # Confirm the actual Kubernetes egress IP before deploying.
            allow 172.28.2.33;
            deny all;
            limit_except POST { deny all; }

            # Docker host networking: reuse the host's existing DNS stub.
            # Resolve at request time so DNS failure does not block startup.
            resolver 127.0.0.53 valid=30s ipv6=off;
            resolver_timeout 5s;
            set $bocha_upstream api.bochaai.com;
            proxy_pass https://$bocha_upstream/v1/web-search;
            proxy_set_header Host api.bochaai.com;
            proxy_set_header Authorization $http_authorization;
            proxy_ssl_server_name on;
            proxy_ssl_name api.bochaai.com;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;
        }

        # Retired DeepSeek route: do not forward it to LiteLLM.
        location = /__aigc/deepseek-search {
            return 404;
        }

        # Keep the original URI for LiteLLM /v1, /key, /model, /ui, etc.
        # This config runs with Docker host networking, so localhost is the host.
        location / {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
