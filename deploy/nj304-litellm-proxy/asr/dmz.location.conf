location = /api-ws/v1/inference {
    # Confirm the source IP seen by DMZ before deployment.
    allow 172.28.2.33;
    deny all;
    # Requires host networking and the host systemd-resolved stub.
    resolver 127.0.0.53 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $asr_host ws-ho4ojmbqyhvmtbay.cn-beijing.maas.aliyuncs.com;
    proxy_pass https://$asr_host/api-ws/v1/inference;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $asr_host;
    proxy_ssl_server_name on;
    proxy_ssl_name $asr_host;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_next_upstream off;
}
