location = /api-ws/v1/inference {
    proxy_pass https://192.168.10.30;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host litellm.boschhuayu-steering.com;
    proxy_ssl_server_name on;
    proxy_ssl_name litellm.boschhuayu-steering.com;
    # User-authorized: retain HTTPS without verifying the DMZ certificate.
    proxy_ssl_verify off;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_next_upstream off;
}
