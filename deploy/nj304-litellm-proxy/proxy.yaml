apiVersion: v1
kind: ConfigMap
metadata:
  name: nj304-litellm-proxy
  namespace: bosch-aigc-dsh
data:
  default.conf: |
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 50m;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /v1/chat/completions {
            proxy_pass https://litellm.boschhuayu-steering.com;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host litellm.boschhuayu-steering.com;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_name litellm.boschhuayu-steering.com;
            # User-authorized bypass: HTTPS remains, upstream identity is not verified.
            proxy_ssl_verify off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_next_upstream off;
        }
        location / {
            return 404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nj304-litellm-proxy
  namespace: bosch-aigc-dsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nj304-litellm-proxy
  template:
    metadata:
      labels:
        app: nj304-litellm-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: bosch-k8s-node-nj304
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nj304-litellm-proxy
        - name: tls
          secret:
            secretName: aigc-edge-tls
---
apiVersion: v1
kind: Service
metadata:
  name: nj304-litellm-proxy
  namespace: bosch-aigc-dsh
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: nj304-litellm-proxy
  ports:
    - name: https
      port: 443
      targetPort: https
      nodePort: 30443
