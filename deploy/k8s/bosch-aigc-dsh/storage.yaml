# No StorageClass exists in this cluster. Provision dedicated static PVs before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aigc-logs
spec:
  storageClassName: ""
  volumeName: bosch-aigc-dsh-logs
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
