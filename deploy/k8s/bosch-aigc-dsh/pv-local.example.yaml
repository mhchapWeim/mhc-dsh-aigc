# Cluster-scoped template: replace every REPLACE_STORAGE_ROOT before applying.
# Create these three directories on bosch-k8s-node-nj304 first.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bosch-aigc-dsh-postgres
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: REPLACE_STORAGE_ROOT/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [bosch-k8s-node-nj304]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bosch-aigc-dsh-data-protection
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: REPLACE_STORAGE_ROOT/data-protection
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [bosch-k8s-node-nj304]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bosch-aigc-dsh-uploads
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: REPLACE_STORAGE_ROOT/uploads
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [bosch-k8s-node-nj304]
