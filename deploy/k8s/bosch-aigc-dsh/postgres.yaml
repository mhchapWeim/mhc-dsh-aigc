apiVersion: apps/v1
kind: Deployment
metadata:
  name: aigc-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aigc-postgres
  template:
    metadata:
      labels:
        app: aigc-postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: bosch-k8s-node-nj304
      containers:
        - name: postgres
          image: aigc-postgres:2026-09-28.2
          imagePullPolicy: Never
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: aigc-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aigc-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aigc-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aigc-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: aigc-postgres
spec:
  type: ClusterIP
  selector:
    app: aigc-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
