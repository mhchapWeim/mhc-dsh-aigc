apiVersion: v1
kind: PersistentVolume
metadata:
  name: aigc-backup-minio
spec:
  capacity: {storage: 100Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /REPLACE_STORAGE_ROOT/minio-backups
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [bosch-k8s-node-nj304]
