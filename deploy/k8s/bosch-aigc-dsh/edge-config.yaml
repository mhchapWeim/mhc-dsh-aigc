apiVersion: v1
kind: ConfigMap
metadata:
  name: aigc-edge-nginx
  namespace: bosch-aigc-dsh
data:
  default.conf: |
    server {
      listen 80;
      server_name aigcbackend.boschhuayu-steering.com;
      return 301 https://$host$request_uri;
    }

    server {
      listen 443 ssl;
      server_name aigcbackend.boschhuayu-steering.com;
      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      client_max_body_size 512m;

      # Static pilot updater feed and immutable installer payloads. The existing
      # desktop test channel requests /dsh-desk/<release-id>/feeds/win-x64/nightly.yml.
      location ^~ /dsh-desk/ {
        root /srv/desktop-updates;
        try_files $uri =404;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
      }

      location ~ ^/(api|v1|health|swagger)(/|$) {
        proxy_pass http://aigc-api.bosch-aigc-dsh.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }

      location / {
        proxy_pass http://aigc-portal.bosch-aigc-dsh.svc.cluster.local:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
      }
    }
